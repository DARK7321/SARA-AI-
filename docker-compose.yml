


services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: omnibrain
      POSTGRES_PASSWORD: omnibrain_dev
      POSTGRES_DB: omnibrain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnibrain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - /app/.git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST_AGENT_URL=http://host.docker.internal:7788
      - DATABASE_URL=postgresql+asyncpg://omnibrain:omnibrain_dev@postgres:5432/omnibrain
      - REDIS_URL=redis://redis:6379/0

  worker:
    build: .
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: arq apps.worker.main.WorkerSettings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST_AGENT_URL=http://host.docker.internal:7788
      - DATABASE_URL=postgresql+asyncpg://omnibrain:omnibrain_dev@postgres:5432/omnibrain
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
